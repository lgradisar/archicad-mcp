[project]
name = "archicad-mcp"
version = "0.2.0"
description = "MCP server for Graphisoft Archicad, built from the Tapir add-on command definitions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.10,<5",
    "jsonschema>=4.18",
]

[project.urls]
Homepage = "https://github.com/lgradisar/archicad-mcp"
Tapir = "https://github.com/ENZYME-APD/tapir-archicad-automation"

[project.scripts]
archicad-mcp = "archicad_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archicad_mcp"]
